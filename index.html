<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Presentation</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css">

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/theme/black.css">

  <style>
    .reveal h1 {
      color: #38bdf8;
    }

    .reveal p {
      color: #cbd5e1;
    }
  </style>
</head>

<body>

  <div class="reveal">
    <div class="slides">

      <!-- SLIDE 1 -->
      <section>
        <h1>My Presentation</h1>
        <p>Created with HTML, CSS & JavaScript</p>
      </section>

      <!-- SLIDE 2 -->
      <section>
        <h2>Introduction</h2>
        <p>This is my second slide.</p>
      </section>

      <!-- SLIDE 3 -->
      <section>
        <h2>Thank You</h2>
      </section>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>

  <script>
    Reveal.initialize({
      transition: 'slide'
    });
  </script>

</body>
</html>
